    <style>
        .green-bubble-bg {
            background: radial-gradient(circle at 20% 20%, #81c784 0%, #388e3c 40%, #1b5e20 80%, #0d3b12 100%);
            position: relative;
            overflow: hidden;
        }
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.2), 0 5px 15px rgba(0, 0, 0, 0.2);
            animation: floatBubble 6s infinite ease-in-out;
        }
        @keyframes floatBubble {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }
        @keyframes fadeInLogo {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-logo-in {
            animation: fadeInLogo 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>

    initLiveChat() {
        if(this.chatMessages.length === 0) {
            this.chatMessages.push({
                sender: 'bot',
                text: 'မင်္ဂလာပါရှင့်။ Green shop မှာ ကြိုဆိုပါသည်, ဘာများကူညီပေးရမလဲ ရှင်'
            });
        }
    },
    sendMessage() {
        if(this.chatInput.trim() !== '') {
            this.chatMessages.push({ sender: 'user', text: this.chatInput });
            let userMsg = this.chatInput;
            this.chatInput = '';
            setTimeout(() => {
                this.chatMessages.push({
                    sender: 'bot',
                    text: 'လူကြီးမင်း မေးမြန်းထားသော \'' + userMsg + '\' အတွက် Customer Support မှ မကြာမီ ပြန်လည်ဖြေကြားပေးပါမည်ရှင့်။'
                });
            }, 1000);
        }
    },
    handleFileUpload(event, type) {
        const file = event.target.files[0];
        if (file) {
            const mediaUrl = URL.createObjectURL(file);
            this.chatMessages.push({
                sender: 'user',
                text: type === 'photo' ? '📷 ဓာတ်ပုံ ပို့လိုက်ပါသည်:' : '🎥 ဗီဒီယို ဖိုင် ပို့လိုက်ပါသည်:',
                media: mediaUrl,
                mediaType: type
            });
            setTimeout(() => {
                this.chatMessages.push({
                    sender: 'bot',
                    text: 'လူကြီးမင်း ပို့လိုက်သော ' + (type === 'photo' ? 'ဓာတ်ပုံ' : 'ဗီဒီယို') + ' ကို ရရှိပါပြီရှင့်။ စစ်ဆေးပေးနေပါသည်။'
                });
            }, 1000);
        }
    },
    init() {
        setTimeout(() => { this.splash = false; }, 3000);
    },
    toggleDarkMode() {
        this.darkMode = !this.darkMode;
        if (this.darkMode) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    }
}">

                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">တည်နေရာ (Location)</label>
                        <input type="text" x-model="location" required placeholder="ရန်ကုန်၊ မြန်မာ" class="w-full p-2.5 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-[#2e7d32]">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">ဖိတ်ကြားကုဒ် (Referral Code)</label>
                        <input type="text" x-model="referral" placeholder="ရှိပါက ထည့်ပါ" class="w-full p-2.5 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-[#2e7d32]">
                    </div>
                    <button type="submit" class="w-full bg-[#2e7d32] hover:bg-[#1b5e20] text-white font-bold py-3 rounded-lg shadow transition">အကောင့်ဖွင့်မည်</button>
                </form>
            </div>

            <!-- 3. LOGIN TAB -->
            <div x-show="currentTab === 'login'" class="bg-white dark:bg-gray-800 p-8 rounded-xl max-w-md mx-auto shadow-sm border border-emerald-100 dark:border-gray-700">
                <h3 class="text-2xl font-bold mb-6 text-center text-[#2e7d32] dark:text-emerald-400">အကောင့်ဝင်ရန်</h3>
                <form @submit.prevent="isLoggedIn = true; currentTab = 'profile'" class="space-y-4">
                    <input type="tel" placeholder="ဖုန်းနံပါတ်" required class="w-full p-3 border rounded-lg dark:bg-gray-700">
                    <input type="password" placeholder="စကားဝှက်" required class="w-full p-3 border rounded-lg dark:bg-gray-700">
                    <button type="submit" class="w-full bg-[#2e7d32] hover:bg-[#1b5e20] text-white py-3 rounded-lg font-bold shadow transition">အကောင့်ဝင်မည်</button>
                </form>
            </div>

            <!-- 4. PROFILE TAB -->
            <div x-show="currentTab === 'profile'" class="bg-white dark:bg-gray-800 p-6 rounded-xl max-w-xl mx-auto shadow-sm border border-emerald-100">
                <h3 class="text-xl font-bold mb-4 text-[#2e7d32]">ဆိုင်ပရိုဖိုင် အချက်အလက်</h3>
                <div class="space-y-2 text-sm">
                    <p><strong>Shop Name:</strong> <span x-text="shopName || 'Green Enterprise'"></span></p>
                    <p><strong>Shop ID:</strong> <span x-text="shopId" class="font-mono"></span></p>
                    <p><strong>Invite Code:</strong> <span x-text="inviteCode" class="font-mono"></span></p>
                    <p><strong>Location:</strong> <span x-text="location || 'ရန်ကုန်'"></span></p>
                </div>
            </div>

        </main>
    </div>

    <!-- MOBILE BOTTOM NAVIGATION BAR -->
    <div class="md:hidden fixed bottom-0 left-0 right-0 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 flex justify-around py-3 z-50 text-xs font-semibold">
        <button @click="currentTab = 'home'; activeCategory = 'all'" class="flex flex-col items-center text-[#2e7d32]">
            <span>🏠</span>
            <span>ပင်မ</span>
        </button>
        <button @click="currentTab = 'products'" class="flex flex-col items-center text-gray-600 dark:text-gray-300">
            <span>🛍️</span>
            <span>ပစ္စည်း</span>
        </button>
        <button @click="serviceModal = true; initLiveChat();" class="flex flex-col items-center text-gray-600 dark:text-gray-300">
            <span>🎧</span>
            <span>ဆာဗစ်</span>
        </button>
        <button @click="if(!isLoggedIn){ currentTab = 'register'; } else { currentTab = 'profile'; }" class="flex flex-col items-center text-gray-600 dark:text-gray-300">
            <span>👤</span>
            <span>ပရိုဖိုင်</span>
        </button>
    </div>

    <!-- FLOATING CUSTOMER SERVICE BUTTON -->
    <div class="hidden md:block fixed bottom-6 right-6 z-50">
        <button @click="serviceModal = true; initLiveChat();" class="bg-white dark:bg-gray-800 border-2 border-[#2e7d32] text-[#2e7d32] dark:text-emerald-100 p-4 rounded-full shadow-2xl hover:scale-110 transition flex items-center justify-center">
            <span class="text-2xl">🎧</span>
        </button>
    </div>

    <!-- LIVE CHAT CUSTOMER SERVICE MODAL -->
    <div x-show="serviceModal" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50" x-cloak>
        <div class="bg-white dark:bg-gray-800 rounded-2xl max-w-md w-full shadow-2xl overflow-hidden flex flex-col h-[520px]">
            <!-- Header -->
            <div class="bg-[#2e7d32] text-white p-4 flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <span class="text-2xl">🎧</span>
                    <div>
                        <h4 class="font-bold text-base">Green Shop Support</h4>
                        <span class="text-xs text-emerald-200">Online • 24/7 Live Chat</span>
                    </div>
                </div>
                <button @click="serviceModal = false" class="text-white hover:text-red-300 font-bold text-xl">&times;</button>
            </div>

            <!-- Chat Messages Area -->
            <div class="flex-1 p-4 overflow-y-auto space-y-3 bg-gray-50 dark:bg-gray-900">
                <template x-for="(msg, index) in chatMessages" :key="index">
                    <div :class="msg.sender === 'user' ? 'flex justify-end' : 'flex justify-start'">
                        <div :class="msg.sender === 'user' ? 'bg-[#2e7d32] text-white rounded-l-xl rounded-tr-xl' : 'bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-100 border border-gray-200 dark:border-gray-700 rounded-r-xl rounded-tl-xl'" class="max-w-[80%] p-3 text-sm shadow-sm space-y-2">
                            <p x-text="msg.text"></p>
                            <template x-if="msg.media && msg.mediaType === 'photo'">
                                <img :src="msg.media" class="rounded-lg max-h-40 w-full object-cover border border-white/20">
                            </template>
                            <template x-if="msg.media && msg.mediaType === 'video'">
                                <video :src="msg.media" controls class="rounded-lg max-h-40 w-full border border-white/20"></video>
                            </template>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Hidden Real File Inputs -->
            <input type="file" id="photoInput" accept="image/*" class="hidden" @change="handleFileUpload($event, 'photo')">
            <input type="file" id="videoInput" accept="video/*" class="hidden" @change="handleFileUpload($event, 'video')">

            <!-- Chat Input Controls -->
            <div class="p-3 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 flex items-center gap-2">
                <!-- Media Buttons (Triggers Real File Pickers) -->
                <button onclick="document.getElementById('photoInput').click()" class="p-2 text-gray-500 hover:text-[#2e7d32] text-lg" title="Send Image">📷</button>
                <button onclick="document.getElementById('videoInput').click()" class="p-2 text-gray-500 hover:text-[#2e7d32] text-lg" title="Send Video">🎥</button>
                
                <!-- Input Box -->
                <input type="text" x-model="chatInput" @keyup.enter="sendMessage()" placeholder="စာရိုက်ပါ..." class="flex-1 p-2 text-sm border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:outline-none focus:ring-1 focus:ring-[#2e7d32]">
                
                <!-- Red Cross Clear Button -->
                <button @click="chatInput = ''" class="p-2 text-red-500 font-extrabold hover:text-red-700 text-base" title="Clear Text">✖</button>
                
                <!-- Send Button -->
                <button @click="sendMessage()" class="bg-[#2e7d32] text-white px-3 py-2 rounded-lg text-sm font-bold hover:bg-[#1b5e20]">Send</button>
            </div>
        </div>
    </div>

</body>
</html>

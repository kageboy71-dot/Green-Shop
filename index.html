<!DOCTYPE html>
<html lang="my" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Shop - 500+ Items Global E-Commerce Platform</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        greenBrand: {
                            50: '#e8f5e9',
                            100: '#c8e6c9',
                            600: '#2e7d32',
                            800: '#1b5e20',
                            900: '#0d3b12',
                        }
                    }
                }
            }
        }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        .green-bubble-bg {
            background: radial-gradient(circle at 20% 20%, #81c784 0%, #388e3c 40%, #1b5e20 80%, #0d3b12 100%);
            position: relative;
            overflow: hidden;
        }
        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.2), 0 5px 15px rgba(0, 0, 0, 0.2);
            animation: floatBubble 6s infinite ease-in-out;
        }
        @keyframes floatBubble {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }
        @keyframes fadeInLogo {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        .animate-logo-in {
            animation: fadeInLogo 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-[#f1f8f2] dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-sans transition-colors duration-300 pb-16 md:pb-0" 
      x-data="{ 
    splash: true,
    currentTab: 'home', 
    activeCategory: 'all',
    lang: 'MY', 
    darkMode: false,
    isLoggedIn: false, 
    shopName: '', 
    phone: '', 
    location: '',
    password: '',
    referral: '',
    shopId: 'GS-884920', 
    inviteCode: 'INV-4921',
    balanceUSD: 0,
    searchQuery: '',
    serviceModal: false,
    items: [],
    generate500Products() {
        const categories = ['apparel', 'fashion', 'textiles', 'general'];
        const names = {
            apparel: ['Casual Cotton T-Shirt', 'Oxford Button Shirt', 'Slim Fit Denim Jeans', 'Myanmar Traditional Longyi Set', 'Evening Party Gown', 'Thermal Fleece Winter Jacket', 'Soft Nightwear Pajamas', 'Designer Hoodie'],
            fashion: ['Urban Running Sneakers', 'Stiletto High Heels', 'Handcrafted Leather Backpack', 'Polarized UV Sunglasses', 'Automatic Quartz Watch', 'Premium Leather Belt', 'Travel Duffle Bag', 'Gold Plated Necklace'],
            textiles: ['Luxury Cotton Bedding Set', 'Soft Bath Towel Set', 'Living Room Blackout Curtains', 'Nordic Floor Carpet', 'Sofa Plush Cover Set', 'Silk Pillowcases Pair', 'Microfiber Cleaning Cloth'],
            general: ['Hydrating Skin Care Set', 'French EDP Spray Perfume', 'Organic Botanical Body Wash', 'Eco Laundry Detergent', 'Whitening Toothpaste Pack', 'Herbal Hair Care Shampoo', 'Moisturizing Hand Lotion']
        };
        const imgs = {
            apparel: ['https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500', 'https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=500', 'https://images.unsplash.com/photo-1542272604-780c36856842?w=500', 'https://images.unsplash.com/photo-1551028719-00167b16eac5?w=500'],
            fashion: ['https://images.unsplash.com/photo-1549298916-b41d501d3772?w=500', 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500', 'https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=500', 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500'],
            textiles: ['https://images.unsplash.com/photo-1616627547584-bf28cee262db?w=500', 'https://images.unsplash.com/photo-1616627547024-814144038a83?w=500', 'https://images.unsplash.com/photo-1513694203232-719a280e022f?w=500'],
            general: ['https://images.unsplash.com/photo-1556228720-195a672e8a03?w=500', 'https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?w=500', 'https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=500']
        };

        let result = [];
        for (let i = 1; i <= 520; i++) {
            let cat = categories[i % 4];
            let nameList = names[cat];
            let imgList = imgs[cat];
            let name = nameList[i % nameList.length] + ' #' + i;
            let img = imgList[i % imgList.length];
            let price = Math.floor(Math.random() * 80) + 10;
            result.push({ id: i, cat: cat, title: name, priceUSD: price, img: img, liked: false, fav: false });
        }
        this.items = result;
    },
    init() {
        this.generate500Products();
        setTimeout(() => { this.splash = false; }, 3200);
    },
    toggleDarkMode() {
        this.darkMode = !this.darkMode;
        if (this.darkMode) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    }
}">

    <!-- SPLASH SCREEN -->
    <div x-show="splash" x-transition:leave="transition ease-in duration-700 transform opacity-0" class="fixed inset-0 green-bubble-bg z-[100] flex flex-col items-center justify-center text-white p-4">
        <div class="bubble w-64 h-64 -top-10 -left-10"></div>
        <div class="bubble w-40 h-40 top-1/2 right-5"></div>
        <div class="bubble w-28 h-28 bottom-10 left-1/3"></div>
        
        <div class="relative z-10 text-center flex flex-col items-center animate-logo-in">
            <div class="w-28 h-28 md:w-36 md:h-36 bg-white/90 rounded-full flex items-center justify-center shadow-2xl p-4 border-4 border-emerald-300 mb-4 backdrop-blur-md">
                <svg viewBox="0 0 100 100" class="w-full h-full">
                    <path d="M 20 50 C 20 20, 50 15, 80 25 C 85 55, 65 85, 35 80 Z" fill="#2e7d32"/>
                    <path d="M 50 25 C 50 25, 68 50, 68 62 C 68 72, 60 80, 50 80 C 40 80, 32 72, 32 62 Z" fill="#81c784"/>
                </svg>
            </div>
            <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight text-white drop-shadow-lg mb-2">
                Green <span class="text-emerald-200">shop</span>
            </h1>
            <p class="text-emerald-100 text-base md:text-xl font-medium tracking-wide animate-pulse">
                Welcome to Green Shop
            </p>
        </div>
    </div>

    <!-- MAIN NAVBAR -->
    <nav class="bg-[#2e7d32] text-white sticky top-0 z-40 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2 cursor-pointer" @click="currentTab = 'home'; activeCategory = 'all'">
                <div class="w-9 h-9 bg-white rounded-full flex items-center justify-center p-1 shadow">
                    <svg viewBox="0 0 100 100" class="w-full h-full">
                        <path d="M 20 50 C 20 20, 50 15, 80 25 Z" fill="#2e7d32"/>
                        <path d="M 50 25 C 50 25, 68 50, 68 62 Z" fill="#81c784"/>
                    </svg>
                </div>
                <span class="text-2xl font-extrabold tracking-wide text-white">Green <span class="text-emerald-200 font-bold">shop</span></span>
            </div>

            <!-- Search Bar -->
            <div class="hidden md:flex flex-1 max-w-md mx-6">
                <input type="text" x-model="searchQuery" 
                       :placeholder="lang === 'MY' ? 'Shop ID သို့မဟုတ် ပစ္စည်းရှာဖွေပါ...' : 'Search Shop ID or Product...'" 
                       class="w-full px-4 py-2 rounded-l-lg text-gray-800 focus:outline-none">
                <button class="bg-[#1b5e20] px-4 py-2 rounded-r-lg font-bold hover:bg-[#14532d]">🔍</button>
            </div>

            <!-- Actions Header -->
            <div class="flex items-center space-x-3 text-sm font-medium">
                <button @click="lang = (lang === 'MY' ? 'EN' : 'MY')" class="px-2.5 py-1 bg-[#1b5e20] rounded font-bold">
                    <span x-text="lang"></span>
                </button>
                <button @click="toggleDarkMode()" class="p-1.5 bg-[#1b5e20] rounded">
                    <span x-text="darkMode ? '☀️' : '🌙'"></span>
                </button>

                <template x-if="!isLoggedIn">
                    <div class="hidden sm:flex space-x-2">
                        <button @click="currentTab = 'login'" class="border border-white/70 px-3 py-1.5 rounded hover:bg-white hover:text-[#2e7d32] transition" x-text="lang === 'MY' ? 'အကောင့်ဝင်ရန်' : 'Login'"></button>
                        <button @click="currentTab = 'register'" class="bg-[#1b5e20] text-white px-3 py-1.5 rounded hover:bg-[#14532d] transition shadow" x-text="lang === 'MY' ? 'အကောင့်ဖွင့်မည်' : 'Register'"></button>
                    </div>
                </template>

                <template x-if="isLoggedIn">
                    <button @click="currentTab = 'profile'" class="bg-[#1b5e20] px-3 py-1.5 rounded flex items-center gap-1">
                        <span>👤</span>
                        <span x-text="shopName"></span>
                    </button>
                </template>
            </div>
        </div>
    </nav>

    <!-- MAIN BODY WITH SIDEBAR -->
    <div class="max-w-7xl mx-auto px-4 py-6 flex flex-col md:flex-row gap-6">

        <!-- SIDEBAR CATEGORIES -->
        <aside class="hidden md:block w-64 bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-emerald-100 dark:border-gray-700 p-4 shrink-0 h-fit">
            <h3 class="font-bold text-lg mb-4 text-[#2e7d32] dark:text-emerald-400 pb-2 border-b border-gray-100 dark:border-gray-700">
                <span x-text="lang === 'MY' ? 'အမျိုးအစားများ' : 'Categories'"></span>
            </h3>

            <ul class="space-y-2 text-sm font-medium">
                <li>
                    <button @click="currentTab = 'products'; activeCategory = 'all'" 
                            :class="activeCategory === 'all' ? 'bg-[#e8f5e9] dark:bg-gray-700 text-[#2e7d32] dark:text-emerald-300 font-bold' : 'text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700'"
                            class="w-full text-left px-3 py-2 rounded-lg transition" x-text="lang === 'MY' ? 'ပစ္စည်းအားလုံး (500+)' : 'All Products (500+)'"></button>
                </li>
                <li>
                    <button @click="currentTab = 'products'; activeCategory = 'apparel'" 
                            :class="activeCategory === 'apparel' ? 'bg-[#e8f5e9] dark:bg-gray-700 text-[#2e7d32] dark:text-emerald-300 font-bold' : 'text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700'"
                            class="w-full text-left px-3 py-2 rounded-lg transition" x-text="lang === 'MY' ? 'အဝတ်အထည်များ (Apparel)' : 'Apparel & Wearables'"></button>
                </li>
                <li>
                    <button @click="currentTab = 'products'; activeCategory = 'fashion'" 
                            :class="activeCategory === 'fashion' ? 'bg-[#e8f5e9] dark:bg-gray-700 text-[#2e7d32] dark:text-emerald-300 font-bold' : 'text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700'"
                            class="w-full text-left px-3 py-2 rounded-lg transition" x-text="lang === 'MY' ? 'ဖက်ရှင်နှင့် ဖိနပ်များ (Fashion)' : 'Fashion & Accessories'"></button>
                </li>
                <li>
                    <button @click="currentTab = 'products'; activeCategory = 'textiles'" 
                            :class="activeCategory === 'textiles' ? 'bg-[#e8f5e9] dark:bg-gray-700 text-[#2e7d32] dark:text-emerald-300 font-bold' : 'text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700'"
                            class="w-full text-left px-3 py-2 rounded-lg transition" x-text="lang === 'MY' ? 'အိမ်သုံး အထည်အလိပ် (Home Textiles)' : 'Home Textiles'"></button>
                </li>
                <li>
                    <button @click="currentTab = 'products'; activeCategory = 'general'" 
                            :class="activeCategory === 'general' ? 'bg-[#e8f5e9] dark:bg-gray-700 text-[#2e7d32] dark:text-emerald-300 font-bold' : 'text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700'"
                            class="w-full text-left px-3 py-2 rounded-lg transition" x-text="lang === 'MY' ? 'လူသုံးကုန်ပစ္စည်းများ (General Goods)' : 'General Goods'"></button>
                </li>
            </ul>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="flex-1">

            <!-- 1. HOME & PRODUCTS CONTENT -->
            <div x-show="currentTab === 'home' || currentTab === 'products'">
                <div class="bg-gradient-to-r from-[#2e7d32] via-[#1b5e20] to-[#0d3b12] text-white rounded-2xl p-6 md:p-10 shadow-md mb-8">
                    <h2 class="text-2xl md:text-4xl font-extrabold mb-3" x-text="lang === 'MY' ? 'Green Shop သို့ ကြိုဆိုပါတယ်' : 'Welcome to Green Shop'"></h2>
                    <p class="text-emerald-100 text-sm md:text-base max-w-xl mb-4" x-text="lang === 'MY' ? 'အကောင့်မဖွင့်ဘဲ ပစ္စည်း ၅၀၀ ကျော်ကို လွတ်လပ်စွာ လေ့လာနိုင်ပါသည်။' : 'Explore over 500+ products freely.'"></p>
                    <span class="text-xs bg-[#1b5e20] text-white px-3 py-1 rounded-full font-semibold shadow-sm">( Exchange Rate: 1 USD = 4,500 MMK )</span>
                </div>

                <!-- 500+ PRODUCTS GRID -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    <template x-for="item in items" :key="item.id">
                        <div x-show="(activeCategory === 'all' || activeCategory === item.cat) && (searchQuery === '' || item.title.toLowerCase().includes(searchQuery.toLowerCase()))" 
                             class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-emerald-100 dark:border-gray-700 overflow-hidden flex flex-col hover:shadow-md transition">
                            <div class="relative h-48 w-full overflow-hidden bg-gray-100">
                                <img :src="item.img" class="h-full w-full object-cover transition transform hover:scale-105 duration-300">
                                <div class="absolute top-2 right-2 flex flex-col gap-1">
                                    <button @click="item.liked = !item.liked" class="bg-white/80 dark:bg-gray-900/80 p-1.5 rounded-full text-xs shadow">
                                        <span x-text="item.liked ? '❤️' : '🤍'"></span>
                                    </button>
                                    <button @click="item.fav = !item.fav" class="bg-white/80 dark:bg-gray-900/80 p-1.5 rounded-full text-xs shadow">
                                        <span x-text="item.fav ? '⭐' : '☆'"></span>
                                    </button>
                                </div>
                            </div>
                            <div class="p-4 flex-1 flex flex-col justify-between">
                                <div>
                                    <h4 class="font-bold text-base text-gray-800 dark:text-gray-100" x-text="item.title"></h4>
                                    <div class="mt-2 flex items-baseline gap-2">
                                        <span class="text-[#2e7d32] dark:text-emerald-400 font-bold text-lg" x-text="(item.priceUSD * 4500).toLocaleString() + ' MMK'"></span>
                                        <span class="text-xs text-gray-400" x-text="'$' + item.priceUSD + ' USD'"></span>
                                    </div>
                                </div>
                                <div class="mt-4 pt-3 border-t border-gray-100 dark:border-gray-700 flex gap-2">
                                    <button onclick="alert('ဆိုင်သို့ တင်သွင်းပြီးပါပြီ')" class="flex-1 bg-[#e8f5e9] dark:bg-gray-700 text-[#2e7d32] dark:text-emerald-300 text-xs font-semibold py-2 rounded">📥 တင်မည်</button>
                                    <button onclick="alert('ခြင်းတောင်းထဲသို့ ထည့်ပြီးပါပြီ')" class="flex-1 bg-[#2e7d32] text-white text-xs font-semibold py-2 rounded shadow hover:bg-[#1b5e20]">🛒 ဝယ်မည်</button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- 2. REGISTER TAB -->
            <div x-show="currentTab === 'register'" class="bg-white dark:bg-gray-800 p-8 rounded-xl max-w-md mx-auto shadow-sm border border-emerald-100 dark:border-gray-700">
                <h3 class="text-2xl font-bold mb-6 text-center text-[#2e7d32] dark:text-emerald-400" x-text="lang === 'MY' ? 'ဆိုင်အကောင့်ဖွင့်မည်' : 'Register Shop'"></h3>
                <form @submit.prevent="isLoggedIn = true; currentTab = 'profile'" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">ဆိုင်နာမည် (Shop Name)</label>
                        <input type="text" x-model="shopName" required placeholder="ဥပမာ - Green Enterprise" class="w-full p-2.5 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-[#2e7d32]">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">ဖုန်းနံပါတ် (Phone Number)</label>
                        <input type="tel" x-model="phone" required placeholder="09xxxxxxxxx" class="w-full p-2.5 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-[#2e7d32]">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">စကားဝှက် (Password)</label>
                        <input type="password" x-model="password" required placeholder="••••••••" class="w-full p-2.5 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-[#2e7d32]">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">တည်နေရာ (Location)</label>
                        <input type="text" x-model="location" required placeholder="ရန်ကုန်၊ မြန်မာ" class="w-full p-2.5 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-[#2e7d32]">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">ဖိတ်ကြားကုဒ် (Referral Code)</label>
                        <input type="text" x-model="referral" placeholder="ရှိပါက ထည့်ပါ" class="w-full p-2.5 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-[#2e7d32]">
                    </div>
                    <button type="submit" class="w-full bg-[#2e7d32] hover:bg-[#1b5e20] text-white font-bold py-3 rounded-lg shadow transition">အကောင့်ဖွင့်မည်</button>
                </form>
            </div>

            <!-- 3. LOGIN TAB -->
            <div x-show="currentTab === 'login'" class="bg-white dark:bg-gray-800 p-8 rounded-xl max-w-md mx-auto shadow-sm border border-emerald-100 dark:border-gray-700">
                <h3 class="text-2xl font-bold mb-6 text-center text-[#2e7d32] dark:text-emerald-400">အကောင့်ဝင်ရန်</h3>
                <form @submit.prevent="isLoggedIn = true; currentTab = 'profile'" class="space-y-4">
                    <input type="tel" placeholder="ဖုန်းနံပါတ်" required class="w-full p-3 border rounded-lg dark:bg-gray-700">
                    <input type="password" placeholder="စကားဝှက်" required class="w-full p-3 border rounded-lg dark:bg-gray-700">
                    <button type="submit" class="w-full bg-[#2e7d32] hover:bg-[#1b5e20] text-white py-3 rounded-lg font-bold shadow transition">အကောင့်ဝင်မည်</button>
                </form>
            </div>

            <!-- 4. PROFILE TAB -->
            <div x-show="currentTab === 'profile'" class="bg-white dark:bg-gray-800 p-6 rounded-xl max-w-xl mx-auto shadow-sm border border-emerald-100">
                <h3 class="text-xl font-bold mb-4 text-[#2e7d32]">ဆိုင်ပရိုဖိုင် အချက်အလက်</h3>
                <div class="space-y-2 text-sm">
                    <p><strong>Shop Name:</strong> <span x-text="shopName || 'Green Enterprise'"></span></p>
                    <p><strong>Shop ID:</strong> <span x-text="shopId" class="font-mono"></span></p>
                    <p><strong>Invite Code:</strong> <span x-text="inviteCode" class="font-mono"></span></p>
                    <p><strong>Location:</strong> <span x-text="location || 'ရန်ကုန်'"></span></p>
                </div>
            </div>

        </main>
    </div>

    <!-- MOBILE BOTTOM NAVIGATION BAR -->
    <div class="md:hidden fixed bottom-0 left-0 right-0 bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 flex justify-around py-3 z-50 text-xs font-semibold">
        <button @click="currentTab = 'home'; activeCategory = 'all'" class="flex flex-col items-center text-[#2e7d32]">
            <span>🏠</span>
            <span>ပင်မ</span>
        </button>
        <button @click="currentTab = 'products'" class="flex flex-col items-center text-gray-600 dark:text-gray-300">
            <span>🛍️</span>
            <span>ပစ္စည်း</span>
        </button>
        <button @click="serviceModal = true" class="flex flex-col items-center text-gray-600 dark:text-gray-300">
            <span>🎧</span>
            <span>ဆာဗစ်</span>
        </button>
        <button @click="if(!isLoggedIn){ currentTab = 'register'; } else { currentTab = 'profile'; }" class="flex flex-col items-center text-gray-600 dark:text-gray-300">
            <span>👤</span>
            <span>ပရိုဖိုင်</span>
        </button>
    </div>

    <!-- FLOATING CUSTOMER SERVICE BUTTON -->
    <div class="hidden md:block fixed bottom-6 right-6 z-50">
        <button @click="serviceModal = true" class="bg-white dark:bg-gray-800 border-2 border-[#2e7d32] text-[#2e7d32] dark:text-emerald-100 p-4 rounded-full shadow-2xl hover:scale-110 transition flex items-center justify-center">
            <span class="text-2xl">🎧</span>
        </button>
    </div>

    <!-- SERVICE MODAL -->
    <div x-show="serviceModal" class="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50" x-cloak>

<!DOCTYPE html>
<html lang="my" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Shop - E-Commerce Platform</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        greenBrand: {
                            50: '#e8f5e9',
                            100: '#c8e6c9',
                            600: '#2e7d32',
                            800: '#1b5e20',
                            900: '#0d3b12',
                            glossy: '#388e3c'
                        }
                    }
                }
            }
        }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        .glossy-green-bg {
            background: linear-gradient(135deg, #4caf50 0%, #1b5e20 100%);
        }
        @keyframes dropLeaf {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0.8; }
        }
        .leaf-animation {
            position: absolute;
            animation: dropLeaf 3s infinite linear;
        }
        @keyframes float3DText {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.03); }
        }
        .animate-3d-logo {
            animation: float3DText 2s infinite ease-in-out;
            text-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body class="bg-[#f1f8f2] dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-sans transition-colors duration-300 pb-16 md:pb-0" 
      x-data="{ 
    splash: true,
    currentTab: 'home', 
    activeCategory: 'all',
    lang: 'MY', 
    darkMode: false,
    isLoggedIn: false, 
    shopName: '', 
    phone: '', 
    location: '',
    password: '',
    referral: '',
    shopId: 'GS-884920', 
    inviteCode: 'INV-4921',
    balanceUSD: 0,
    searchQuery: '',
    serviceModal: false,
    init() {
        setTimeout(() => { this.splash = false; }, 3000);
    },
    toggleDarkMode() {
        this.darkMode = !this.darkMode;
        if (this.darkMode) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    }
}">

    <!-- 3D SPLASH SCREEN (Image Theme matching) -->
    <div x-show="splash" x-transition:leave="transition ease-in duration-700 transform opacity-0" class="fixed inset-0 glossy-green-bg z-[100] flex flex-col items-center justify-center text-white p-4 overflow-hidden">
        <!-- Falling Leaves Effect -->
        <div class="absolute inset-0 pointer-events-none overflow-hidden">
            <span class="leaf-animation text-3xl left-[10%] top-[-10%]" style="animation-delay: 0s;">🍃</span>
            <span class="leaf-animation text-2xl left-[30%] top-[-10%]" style="animation-delay: 1s;">🌿</span>
            <span class="leaf-animation text-4xl left-[60%] top-[-10%]" style="animation-delay: 0.5s;">🍃</span>
            <span class="leaf-animation text-3xl left-[80%] top-[-10%]" style="animation-delay: 1.5s;">🌿</span>
        </div>

        <!-- 3D Logo Display -->
        <div class="relative z-10 text-center">
            <div class="text-5xl md:text-7xl font-extrabold tracking-wider text-white mb-3 animate-3d-logo flex items-center justify-center gap-2">
                <span>Green Shop</span><span class="text-emerald-300">.</span> 🍃
            </div>
            <p class="text-emerald-100 text-base md:text-lg font-medium tracking-wide animate-pulse">Welcome to Green Shop</p>
        </div>
    </div>

    <!-- MAIN NAVBAR -->
    <nav class="bg-[#2e7d32] text-white sticky top-0 z-40 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <!-- Brand Logo -->
            <div class="flex items-center space-x-2 cursor-pointer" @click="currentTab = 'home'; activeCategory = 'all'">
                <div class="bg-white/10 px-3 py-1.5 rounded-xl border border-white/20 shadow-inner flex items-center gap-1">
                    <span class="text-xl font-extrabold tracking-wider">Green Shop</span>
                    <span class="text-emerald-300 font-bold text-xl">.</span>
                    <span class="text-lg">🍃</span>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="hidden md:flex flex-1 max-w-md mx-6">
                <input type="text" x-model="searchQuery" 
                       :placeholder="lang === 'MY' ? 'Shop ID၊ ပစ္စည်းအမည် ရှာဖွေပါ...' : 'Search Shop ID or Product...'" 
                       class="w-full px-4 py-2 rounded-l-lg text-gray-800 focus:outline-none">
                <button class="bg-[#1b5e20] px-4 py-2 rounded-r-lg font-bold hover:bg-[#14532d]">🔍</button>
            </div>

            <!-- Actions Header -->
            <div class="flex items-center space-x-3 text-sm font-medium">
                <button @click="lang = (lang === 'MY' ? 'EN' : 'MY')" class="px-2.5 py-1 bg-[#1b5e20] rounded font-bold">
                    <span x-text="lang"></span>
                </button>
                <button @click="toggleDarkMode()" class="p-1.5 bg-[#1b5e20] rounded">
                    <span x-text="darkMode ? '☀️' : '🌙'"></span>
                </button>

                <template x-if="!isLoggedIn">
                    <div class="hidden sm:flex space-x-2">
                        <button @click="currentTab = 'login'" class="border border-white/70 px-3 py-1.5 rounded hover:bg-white hover:text-[#2e7d32] transition" x-text="lang === 'MY' ? 'အကောင့်ဝင်ရန်' : 'Login'"></button>
                        <button @click="currentTab = 'register'" class="bg-[#1b5e20] text-white px-3 py-1.5 rounded hover:bg-[#14532d] transition shadow" x-text="lang === 'MY' ? 'အကောင့်ဖွင့်မည်' : 'Register'"></button>
                    </div>
                </template>

                <template x-if="isLoggedIn">
                    <button @click="currentTab = 'profile'" class="bg-[#1b5e20] px-3 py-1.5 rounded flex items-center gap-1">
                        <span>👤</span>
                        <span x-text="shopName"></span>
                    </button>
                </template>
            </div>
        </div>
    </nav>

    <!-- MAIN BODY WITH SIDEBAR -->
    <div class="max-w-7xl mx-auto px-4 py-6 flex flex-col md:flex-row gap-6">

        <!-- SIDEBAR CATEGORIES -->
        <aside class="hidden md:block w-64 bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-emerald-100 dark:border-gray-700 p-4 shrink-0 h-fit">
            <h3 class="font-bold text-lg mb-4 text-[#2e7d32] dark:text-emerald-400 pb-2 border-b border-gray-100 dark:border-gray-700">
                <span x-text="lang === 'MY' ? 'အမျိုးအစားများ' : 'Categories'"></span>
            </h3>

            <ul class="space-y-2 text-sm font-medium">
                <li>
                    <button @click="currentTab = 'products'; activeCategory = 'all'" 
                            :class="activeCategory === 'all' ? 'bg-[#e8f5e9] dark:bg-gray-700 text-[#2e7d32] dark:text-emerald-300 font-bold' : 'text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700'"
                            class="w-full text-left px-3 py-2 rounded-lg transition" x-text="lang === 'MY' ? 'ပစ္စည်းအားလုံး' : 'All Products'"></button>
                </li>
                <li>
                    <button @click="currentTab = 'products'; activeCategory = 'apparel'" 
                            :class="activeCategory === 'apparel' ? 'bg-[#e8f5e9] dark:bg-gray-700 text-[#2e7d32] dark:text-emerald-300 font-bold' : 'text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700'"
                            class="w-full text-left px-3 py-2 rounded-lg transition" x-text="lang === 'MY' ? 'ဝတ်ဆင်စရာ အဝတ်အထည်များ' : 'Apparel & Wearables'"></button>
                </li>
                <li>
                    <button @click="currentTab = 'products'; activeCategory = 'fashion'" 
                            :class="activeCategory === 'fashion' ? 'bg-[#e8f5e9] dark:bg-gray-700 text-[#2e7d32] dark:text-emerald-300 font-bold' : 'text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700'"
                            class="w-full text-left px-3 py-2 rounded-lg transition" x-text="lang === 'MY' ? 'ဖက်ရှင်နှင့် ဖိနပ်များ' : 'Fashion & Footwear'"></button>
                </li>
                <li>
                    <button @click="currentTab = 'products'; activeCategory = 'textiles'" 
                            :class="activeCategory === 'textiles' ? 'bg-[#e8f5e9] dark:bg-gray-700 text-[#2e7d32] dark:text-emerald-300 font-bold' : 'text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700'"
                            class="w-full text-left px-3 py-2 rounded-lg transition" x-text="lang === 'MY' ? 'အိမ်သုံး အထည်အလိပ်များ' : 'Home Textiles'"></button>
                </li>
                <li>
                    <button @click="currentTab = 'products'; activeCategory = 'general'" 
                            :class="activeCategory === 'general' ? 'bg-[#e8f5e9] dark:bg-gray-700 text-[#2e7d32] dark:text-emerald-300 font-bold' : 'text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700'"
                            class="w-full text-left px-3 py-2 rounded-lg transition" x-text="lang === 'MY' ? 'လူသုံးကုန်နှင့် အထွေထွေ' : 'General Goods'"></button>
                </li>
            </ul>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="flex-1">

            <!-- 1. HOME & PRODUCTS CONTENT -->
            <div x-show="currentTab === 'home' || currentTab === 'products'">
                <div class="glossy-green-bg text-white rounded-2xl p-6 md:p-10 shadow-md mb-8">
                    <h2 class="text-2xl md:text-4xl font-extrabold mb-3" x-text="lang === 'MY' ? 'Green Shop သို့ ကြိုဆိုပါတယ်' : 'Welcome to Green Shop'"></h2>
                    <p class="text-emerald-100 text-sm md:text-base max-w-xl mb-4" x-text="lang === 'MY' ? 'အကောင့်မဖွင့်ဘဲ လွတ်လပ်စွာ လေ့လာနိုင်ပြီး စိတ်ကြိုက် ဝယ်ယူနိုင်ပါသည်။' : 'Explore freely without logging in.'"></p>
                    <span class="text-xs bg-[#1b5e20] text-white px-3 py-1 rounded-full font-semibold shadow-sm">( Exchange Rate: 1 USD = 4,500 MMK )</span>
                </div>

                <!-- Products Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" 
                     x-data="{
                    items: [
                        { id: 1, cat: 'apparel', title: 'ပရီမီယံ တီရှပ် (Casual Cotton T-Shirt)', priceUSD: 12, img: 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500&auto=format&fit=crop', liked: false, fav: false },
                        { id: 2, cat: 'apparel', title: 'မြန်မာ ရိုးရာ ဝတ်စုံ (Traditional Outfit)', priceUSD: 35, img: 'https://images.unsplash.com/photo-1617627143750-d86bc21e42bb?w=500&auto=format&fit=crop', liked: false, fav: false },
                        { id: 3, cat: 'apparel', title: 'ဆောင်းရာသီဝတ် ဂျာကင် (Winter Jacket)', priceUSD: 45, img: 'https://images.unsplash.com/photo-1551028719-00167b16eac5?w=500&auto=format&fit=crop', liked: false, fav: false },
                        { id: 4, cat: 'fashion', title: 'စနီကာ ဖိနပ် (Casual Sneakers)', priceUSD: 50, img: 'https://images.unsplash.com/photo-1549298916-b41d501d3772?w=500&auto=format&fit=crop', liked: false, fav: false },
                        { id: 5, cat: 'fashion', title: 'သဘာဝ သားရေ အိတ် (Leather Handbag)', priceUSD: 40, img: 'https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=500&auto=format&fit=crop', liked: false, fav: false },
                        { id: 6, cat: 'fashion', title: 'UV ကာကွယ် နေကာမျက်မှန် (Sunglasses)', priceUSD: 18, img: 'https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=500&auto=format&fit=crop', liked: false, fav: false },
                        { id: 7, cat: 'textiles', title: 'ဇိမ်ခံ အိပ်ယာခင်း အစုံ (Luxury Bedding Set)', priceUSD: 60, img: 'https://images.unsplash.com/photo-1616627547584-bf28cee262db?w=500&auto=format&fit=crop', liked: false, fav: false },
                        { id: 8, cat: 'textiles', title: 'ပျော့ပျောင်းသော ရေချိုးတဘက် (Bath Towel)', priceUSD: 15, img: 'https://images.unsplash.com/photo-1616627547024-814144038a83?w=500&auto=format&fit=crop', liked: false, fav: false },
                        { id: 9, cat: 'general', title: 'စကင်ကဲရ် ပစ္စည်းအစုံ (Skin Care Set)', priceUSD: 30, img: 'https://images.unsplash.com/photo-1556228720-195a672e8a03?w=500&auto=format&fit=crop', liked: false, fav: false },
                        { id: 10, cat: 'general', title: 'သဘာဝ ရေမွှေး (Luxury Perfume)', priceUSD: 55, img: 'https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?w=500&auto=format&fit=crop', liked: false, fav: false }
                    ]
                }">
                    <template x-for="item in items" :key="item.id">
                        <div x-show="activeCategory === 'all' || activeCategory === item.cat" 
                             class="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-emerald-100 dark:border-gray-700 overflow-hidden flex flex-col hover:shadow-md transition">
                            <div class="relative h-48 w-full overflow-hidden bg-gray-100">
                                <img :src="item.img" class="h-full w-full object-cover transition transform hover:scale-105 duration-300">
                                <div class="absolute top-2 right-2 flex flex-col gap-1">
                                    <button @click="item.liked = !item.liked" class="bg-white/80 dark:bg-gray-900/80 p-1.5 rounded-full text-xs shadow">
                                        <span x-text="item.liked ? '❤️' : '🤍'"></span>
                                    </button>
                                    <button @click="item.fav = !item.fav" class="bg-white/80 dark:bg-gray-900/80 p-1.5 rounded-full text-xs shadow">
                                        <span x-text="item.fav ? '⭐' : '☆'"></span>
                                    </button>
                                </div>
                            </div>
                            <div class="p-4 flex-1 flex flex-col justify-between">
                                <div>
                                    <h4 class="font-bold text-base text-gray-800 dark:text-gray-100" x-text="item.title"></h4>
                                    <div class="mt-2 flex items-baseline gap-2">
                                        <span class="text-[#2e7d32] dark:text-emerald-400 font-bold text-lg" x-text="(item.priceUSD * 4500).toLocaleString() + ' MMK'"></span>
                                        <span class="text-xs text-gray-400" x-text="'\$' + item.priceUSD + ' USD'"></span>
                                    </div>
                                </div>
                                <div class="mt-4 pt-3 border-t border-gray-100 dark:border-gray-700 flex gap-2">
                                    <button onclick="alert('ဆိုင်သို့ တင်သွင်းပြီးပါပြီ')" class="flex-1 bg-[#e8f5e9] dark:bg-gray-700 text-[#2e7d32] dark:text-emerald-300 text-xs font-semibold py-2 rounded">📥 တင်မည်</button>
                                    <button onclick="alert('ခြင်းတောင်းထဲသို့ ထည့်ပြီးပါပြီ')" class="flex-1 bg-[#2e7d32] text-white text-xs font-semibold py-2 rounded shadow hover:bg-[#1b5e20]">🛒 ဝယ်မည်</button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- 2. REGISTER TAB -->
            <div x-show="currentTab === 'register'" class="bg-white dark:bg-gray-800 p-8 rounded-xl max-w-md mx-auto shadow-sm border border-emerald-100 dark:border-gray-700">
                <h3 class="text-2xl font-bold mb-6 text-center text-[#2e7d32] dark:text-emerald-400" x-text="lang === 'MY' ? 'ဆိုင်အကောင့်ဖွင့်မည်' : 'Register Shop'"></h3>
                <form @submit.prevent="isLoggedIn = true; currentTab = 'profile'" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">ဆိုင်နာမည် (Shop Name)</label>
                        <input type="text" x-model="shopName" required placeholder="ဥပမာ - Green Enterprise" class="w-full p-2.5 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-[#2e7d32]">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">ဖုန်းနံပါတ် (Phone Number)</label>
                        <input type="tel" x-model="phone" required placeholder="09xxxxxxxxx" class="w-full p-2.5 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-[#2e7d32]">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">စကားဝှက် (Password)</label>
                        <input type="password" x-model="password" required placeholder="••••••••" class="w-full p-2.5 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-[#2e7d32]">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">တည်နေရာ (Location)</label>
                        <input type="text" x-model="location" required placeholder="ရန်ကုန်၊ မြန်မာ" class="w-full p-2.5 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-[#2e7d32]">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">ဖိတ်ကြားကုဒ် (Referral Code)</label>
                        <input type="text" x-model="referral" placeholder="ရှိပါက ထည့်ပါ" class="w-full p-2.5 border rounded-lg dark:bg-gray-700 dark:border-gray-600 focus:ring-2 focus:ring-[#2e7d32]">
                    </div>
                    <button type="submit" class="w-full bg-[#2e7d32] hover:bg-[#1b5e20] text-white font-bold py-3 rounded-lg shadow transition">အကောင့်ဖွင့်မည်</button>
                </form>
            </div>

            <!-- 3. LOGIN TAB -->
            <div x-show="currentTab === 'login'" class="bg-white dark:bg-gray-800 p-8 rounded-xl max-w-md mx-auto shadow-sm border border-emerald-100 dark:border-gray-700">
                <h3 class="text-2xl font-bold mb-6 text-center text-[#2e7d32] dark:text-emerald-400">အကောင့်ဝင်ရန်</h3>
                <form @submit.prevent="isLoggedIn = true; currentTab = 'profile'" class="space-y-4">
                    <input type="tel" placeholder="ဖုန်းနံပါတ်" required class="w-full p-3 border rounded-lg dark:bg-gray-700">
                    <input type="password" placeholder="စကားဝှက်" required class="w-full p-3 border rounded-lg dark:bg-gray-700">
                    <button type="submit" class="w-full bg-[#2e7d32] hover:bg-[#1b5e20] text-white py-3 rounded-lg font-bold shadow transition
